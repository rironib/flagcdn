<!DOCTYPE html>
<html lang="en" class="bg-gray-100 text-gray-800">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flag CDN</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="shortcut icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <link rel="manifest" href="/site.webmanifest"/>
</head>
<body class="font-sans">
<!-- Header -->
<header class="bg-white shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-5 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-600">🌍 Flag CDN</h1>
        <a href="https://github.com/HatScripts/circle-flags" target="_blank" class="text-sm text-gray-500 hover:text-indigo-600">
            Source: HatScripts
        </a>
    </div>
</header>

<!-- Hero Section -->
<section class="max-w-4xl mx-auto p-6 text-center">
    <h2 class="text-3xl font-semibold mb-4">Get Circular Country Flags Instantly</h2>
    <p class="text-gray-600 mb-6">
        Use any ISO 3166-1 alpha-2 code like <code class="bg-gray-100 px-1 rounded">us</code>, <code class="bg-gray-100 px-1 rounded">fr</code>, or <code class="bg-gray-100 px-1 rounded">jp</code>.
    </p>

    <div class="bg-white rounded shadow p-4 mb-8">
        <p class="text-sm font-medium mb-2 text-left">Example:</p>
        <code class="block bg-gray-100 p-3 rounded text-sm text-left overflow-x-auto">
            &lt;img src="https://flagcdn.vercel.app/flags/us.svg" alt="US Flag" width="64" height="64" /&gt;
        </code>
        <div class="mt-4 flex justify-center">
            <img src="/flags/us.svg" alt="US Flag" class="w-16 h-16 rounded-full border" />
        </div>
    </div>
</section>

<!-- Popular Flags Grid -->
<section class="max-w-5xl mx-auto px-6">
    <h3 class="text-xl font-semibold mb-4">Popular Flags</h3>
    <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-6">
        <div class="text-center">
            <img src="/flags/us.svg" alt="US" class="w-12 h-12 mx-auto rounded-full border" />
            <span class="text-sm text-gray-600 mt-1 block">US</span>
        </div>
        <div class="text-center">
            <img src="/flags/gb.svg" alt="GB" class="w-12 h-12 mx-auto rounded-full border" />
            <span class="text-sm text-gray-600 mt-1 block">GB</span>
        </div>
        <div class="text-center">
            <img src="/flags/fr.svg" alt="FR" class="w-12 h-12 mx-auto rounded-full border" />
            <span class="text-sm text-gray-600 mt-1 block">FR</span>
        </div>
        <div class="text-center">
            <img src="/flags/de.svg" alt="DE" class="w-12 h-12 mx-auto rounded-full border" />
            <span class="text-sm text-gray-600 mt-1 block">DE</span>
        </div>
        <div class="text-center">
            <img src="/flags/jp.svg" alt="JP" class="w-12 h-12 mx-auto rounded-full border" />
            <span class="text-sm text-gray-600 mt-1 block">JP</span>
        </div>
        <div class="text-center">
            <img src="/flags/in.svg" alt="IN" class="w-12 h-12 mx-auto rounded-full border" />
            <span class="text-sm text-gray-600 mt-1 block">IN</span>
        </div>
        <div class="text-center">
            <img src="/flags/it.svg" alt="IT" class="w-12 h-12 mx-auto rounded-full border" />
            <span class="text-sm text-gray-600 mt-1 block">IT</span>
        </div>
        <div class="text-center">
            <img src="/flags/ca.svg" alt="CA" class="w-12 h-12 mx-auto rounded-full border" />
            <span class="text-sm text-gray-600 mt-1 block">CA</span>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="text-center text-sm text-gray-500 py-6 mt-12">
    &copy; 2025 Flag CDN — Hosted on <a href="https://vercel.com" class="text-indigo-500 hover:underline">Vercel</a>
</footer>
</body>
</html>
